<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتاق گفتگو</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --gray-color: #6c757d;
        }
        
        body {
            font-family: 'Vazir', sans-serif;
            background-color: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }
        
        .chat-container {
            height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .users-panel {
            background-color: white;
            border-right: 1px solid #e9ecef;
            overflow-y: auto;
        }
        
        .chat-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .chat-header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background-color: #e5ddd5;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAAQklEQVRoQ+3SMQ0AAAgEoJNc7B9i0A0M2CqViqIoiqIoiqIoiqIoiqIoiqIoiqIoiqIoiqIoiqIoiqIoiqIoiqL4VQ8xcAESFqJ9iwAAAABJRU5ErkJggg==');
        }
        
        .message-input {
            background-color: white;
            padding: 1rem;
            border-top: 1px solid #e9ecef;
        }
        
        .message {
            max-width: 75%;
            margin-bottom: 1rem;
            clear: both;
        }
        
        .received {
            float: right;
            background-color: white;
            border-radius: 15px 15px 0 15px;
        }
        
        .sent {
            float: left;
            background-color: #dcf8c6;
            border-radius: 15px 15px 15px 0;
        }
        
        .user-item {
            transition: all 0.3s;
            border-bottom: 1px solid #f0f2f5;
        }
        
        .user-item:hover {
            background-color: #f8f9fa;
        }
        
        .online-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            background-color: #28a745;
        }
        
        .auth-modal .modal-content {
            border-radius: 15px;
            overflow: hidden;
        }
        
        .auth-header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 1.5rem;
        }
        
        .tab-content {
            padding: 1.5rem;
        }
    </style>
</head>
<body>
    <!-- Authentication Modal -->
    <div class="modal fade auth-modal" id="authModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="auth-header">
                    <h5 class="modal-title">به اتاق گفتگو خوش آمدید</h5>
                </div>
                <div class="modal-body">
                    <ul class="nav nav-tabs nav-fill mb-3" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">ورود</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="signup-tab" data-bs-toggle="tab" data-bs-target="#signup" type="button" role="tab">ثبت نام</button>
                        </li>
                    </ul>
                    
                    <div class="tab-content" id="authTabsContent">
                        <div class="tab-pane fade show active" id="login" role="tabpanel">
                            <div class="mb-3">
                                <label for="loginUsername" class="form-label">نام کاربری</label>
                                <input type="text" class="form-control" id="loginUsername" placeholder="نام کاربری خود را وارد کنید">
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">رمز عبور</label>
                                <input type="password" class="form-control" id="loginPassword" placeholder="رمز عبور خود را وارد کنید">
                            </div>
                            <button id="loginBtn" class="btn btn-primary w-100">ورود به سیستم</button>
                        </div>
                        
                        <div class="tab-pane fade" id="signup" role="tabpanel">
                            <div class="mb-3">
                                <label for="signupUsername" class="form-label">نام کاربری</label>
                                <input type="text" class="form-control" id="signupUsername" placeholder="یک نام کاربری انتخاب کنید">
                            </div>
                            <div class="mb-3">
                                <label for="signupPassword" class="form-label">رمز عبور</label>
                                <input type="password" class="form-control" id="signupPassword" placeholder="رمز عبور خود را وارد کنید">
                            </div>
                            <div class="mb-3">
                                <label for="signupConfirm" class="form-label">تکرار رمز عبور</label>
                                <input type="password" class="form-control" id="signupConfirm" placeholder="رمز عبور را تکرار کنید">
                            </div>
                            <button id="signupBtn" class="btn btn-success w-100">ثبت نام</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Chat Interface -->
    <div class="container-fluid h-100 d-none" id="chatInterface">
        <div class="row h-100">
            <!-- Users Panel -->
            <div class="col-md-3 col-lg-2 p-0 users-panel">
                <div class="d-flex flex-column h-100">
                    <div class="p-3 border-bottom">
                        <h5 class="mb-0">کاربران آنلاین</h5>
                    </div>
                    <div class="flex-grow-1 overflow-auto">
                        <ul class="list-group list-group-flush" id="usersList">
                            <!-- Users will be dynamically added here -->
                        </ul>
                    </div>
                    <div class="p-3 border-top">
                        <div class="d-flex align-items-center">
                            <div class="flex-grow-1">
                                <strong id="currentUsername"></strong>
                                <div class="text-success small">
                                    <span class="online-badge"></span> آنلاین
                                </div>
                            </div>
                            <button id="logoutBtn" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-box-arrow-left"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Chat Panel -->
            <div class="col-md-9 col-lg-10 p-0">
                <div class="d-flex flex-column h-100 chat-panel">
                    <!-- Chat Header -->
                    <div class="chat-header d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h4 class="mb-0">اتاق گفتگوی عمومی</h4>
                        </div>
                        <div>
                            <span id="onlineCount">0</span> کاربر آنلاین
                        </div>
                    </div>
                    
                    <!-- Messages Container -->
                    <div class="messages-container" id="messagesContainer" style="max-height: 500px">
                        <!-- Messages will be dynamically added here -->
                    </div>
                    
                    <!-- Message Input -->
                    <div class="message-input">
                        <div class="input-group">
                            <input type="text" class="form-control" id="messageInput" placeholder="پیام خود را بنویسید..." disabled>
                            <button class="btn btn-primary" id="sendBtn" disabled>
                                <i class="bi bi-send"></i> ارسال
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Initialize Bootstrap Modal
        const authModal = new bootstrap.Modal(document.getElementById('authModal'), {backdrop: 'static'});
        authModal.show();
        
        // WebSocket Connection
        let loc = window.location;
        let wsStart = (loc.protocol === "https:") ? "wss://" : "ws://";
        let endpoint = wsStart + loc.host + "/ws/chat/";
        let socket = new WebSocket(endpoint);
        let currentUser = null;
        
        // DOM Elements
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const usersList = document.getElementById('usersList');
        const currentUsernameEl = document.getElementById('currentUsername');
        const onlineCountEl = document.getElementById('onlineCount');
        const logoutBtn = document.getElementById('logoutBtn');
        const chatInterface = document.getElementById('chatInterface');
        
        // Event Listeners
        loginBtn.addEventListener('click', handleLogin);
        signupBtn.addEventListener('click', handleSignup);
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        logoutBtn.addEventListener('click', handleLogout);
        
        // WebSocket Event Handlers
        socket.onopen = function(e) {
            console.log("WebSocket connection established");
        };
        
        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            console.log("Received data:", data);
            
            switch(data.action) {
                case 'authenticated':
                    handleAuthentication(data);
                    break;
                case 'auth_error':
                    showAuthError(data.message);
                    break;
                case 'message':
                    addMessage(data);
                    break;
                case 'user_status':
                    updateUserStatus(data);
                    break;
                case 'users_list':
                    updateUsersList(data.users);
                    break;
            }
        };
        
        socket.onclose = function(e) {
            console.log("WebSocket connection closed");
        };
        
        socket.onerror = function(e) {
            console.error("WebSocket error:", e);
        };
        
        // Functions
        function handleLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                showAuthError('لطفاً نام کاربری و رمز عبور را وارد کنید');
                return;
            }
            
            socket.send(JSON.stringify({
                action: 'login',
                username: username,
                password: password
            }));
        }
        
        function handleSignup() {
            const username = document.getElementById('signupUsername').value;
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            
            if (!username || !password) {
                showAuthError('لطفاً نام کاربری و رمز عبور را وارد کنید');
                return;
            }
            
            if (password !== confirm) {
                showAuthError('رمز عبور و تکرار آن مطابقت ندارند');
                return;
            }
            
            socket.send(JSON.stringify({
                action: 'signup',
                username: username,
                password: password
            }));
        }
        
        function handleAuthentication(data) {
            currentUser = data.username;
            currentUsernameEl.textContent = currentUser;
            
            // Add previous messages
            data.messages.reverse().forEach(msg => {
                addMessage(msg);
            });
            
            // Hide modal and show chat interface
            authModal.hide();
            document.querySelector('.modal-backdrop').remove();
            chatInterface.classList.remove('d-none');
            
            // Enable message input
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
            
            // Request users list
            socket.send(JSON.stringify({
                action: 'get_users'
            }));
        }
        
        function showAuthError(message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-danger mt-3';
            alertDiv.textContent = message;
            
            const activeTab = document.querySelector('.tab-pane.active');
            const existingAlert = activeTab.querySelector('.alert');
            
            if (existingAlert) {
                existingAlert.remove();
            }
            
            activeTab.appendChild(alertDiv);
        }
        
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !currentUser) return;
            
            socket.send(JSON.stringify({
                action: 'message',
                message: message
            }));
            
            messageInput.value = '';
            messageInput.focus();
        }
        
        function addMessage(data) {
            const isCurrentUser = data.user === currentUser;
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isCurrentUser ? 'sent' : 'received'}`;
            
            messageDiv.innerHTML = `
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-2">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <strong class="card-title">${data.user}</strong>
                            <small class="text-muted">${data.time}</small>
                        </div>
                        <p class="card-text mb-0">${data.content ? data.content : data.message}</p>
                    </div>
                </div>
            `;
            
            console.log(`content: ${data.content} | message: ${data.message} ---- if: ${data.content ? data.content : data.message}`)
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function updateUserStatus(data) {
            if (data.online) {
                // Add user to list
                addUserToList(data.user);
            } else {
                // Remove user from list
                removeUserFromList(data.user);
            }
            
            // Update online count
            const userItems = usersList.querySelectorAll('.user-item');
            onlineCountEl.textContent = userItems.length;
        }
        
        function updateUsersList(users) {
            // Clear current list
            usersList.innerHTML = '';
            
            // Add all users
            users.forEach(user => {
                addUserToList(user);
            });
            
            // Update online count
            onlineCountEl.textContent = users.length;
        }
        
        function addUserToList(username) {
            // Check if user already exists
            if (usersList.querySelector(`[data-username="${username}"]`)) {
                return;
            }
            
            const userItem = document.createElement('li');
            userItem.className = 'list-group-item user-item d-flex align-items-center';
            userItem.dataset.username = username;
            
            userItem.innerHTML = `
                <span class="online-badge me-2"></span>
                <span class="flex-grow-1">${username}</span>
            `;
            
            usersList.appendChild(userItem);
        }
        
        function removeUserFromList(username) {
            const userItem = usersList.querySelector(`[data-username="${username}"]`);
            if (userItem) {
                userItem.remove();
            }
        }
        
        function handleLogout() {
            if (socket.readyState === WebSocket.OPEN) {
                socket.close();
            }
            
            window.location.reload();
        }
    </script>
</body>
</html>
